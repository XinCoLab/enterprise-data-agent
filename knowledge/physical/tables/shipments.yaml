- knowledge_id: column.cold_chain_pharma_compliance.shipments.shipment_overview
  knowledge_type: column
  database_id: cold_chain_pharma_compliance
  title: 'Shipments: Shipment Overview'
  summary: JSONB column. Groups routing, timing and risk-performance metadata of a single cold-chain shipment so
    that dashboards can fetch a complete lane summary from one JSONB field.
  payload:
    table_id: table.cold_chain_pharma_compliance.shipments
    physical_name: shipment_overview
    physical_type: jsonb
    business_type: jsonb
    column_role: unknown
    nullable: true
    business_definition: 'JSONB column. Groups routing, timing and risk-performance metadata of a single cold-chain
      shipment so that dashboards can fetch a complete lane summary from one JSONB field.

      Nested public field meanings:

      - route.origin.hub: text. Code of the originating logistics hub. Example: Gonzales-Lopez Facility.

      - route.origin.address: text. Street-level origin address. Example: 0131 Johnson Station

      New Tinatown, FL 65757.

      - route.origin.nation: text. ISO country code of origin. **NULL means country not provided.**. Example: Fiji.

      - route.destination.hub: text. Code of the destination logistics hub. Example: Williams-Aguilar Hospital.

      - route.destination.address: text. Street-level destination address. Example: 7209 West Flats

      East Tonya, OR 13658.

      - route.destination.nation: text. ISO country code of destination. **NULL means country not provided.**. Example:
      Bouvet Island (Bouvetoya).

      - route.route_string: text. Encoded string of planned route waypoints. Example: Fiji -> Bouvet Island (Bouvetoya).

      - route.risk_note: text. Qualitative notes on route-specific risks. Possible values: High, Low, Medium.

      - timing_performance.go_time_ts: timestamp. Planned departure timestamp. Example: 2025/2/17 19:29.

      - timing_performance.planned_eta_hrs: bigint. Estimated transit time in hours. Example: 27.6.

      - timing_performance.actual_duration_hrs: bigint. Actual transit time in hours. **NULL means actual hours
      not yet recorded.**. Example: 10.2.

      - timing_performance.end_time_ts: timestamp. Actual arrival timestamp. Possible values: 2025/2/19 08:29.

      - timing_performance.distance_km: bigint. Total kilometres travelled for the shipment. Example: 2608.'
    unit: hours
    default_aggregation: null
    usage_warnings:
    - NULL means country not provided.
    - NULL means actual hours not yet recorded.
  discovery:
    keywords:
    - shipment_overview
    - Shipment Overview
    - shipments
    - jsonb
    - unknown
    - route.origin.hub
    - hub
    - route.origin.address
    - address
    - route.origin.nation
    - nation
    - route.destination.hub
    - route.destination.address
    - route.destination.nation
    - route.route_string
    - route_string
    - route.risk_note
    - risk_note
    - timing_performance.go_time_ts
    - go_time_ts
