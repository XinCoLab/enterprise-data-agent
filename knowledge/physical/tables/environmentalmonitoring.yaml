- knowledge_id: column.cold_chain_pharma_compliance.environmentalmonitoring.env_metrics
  knowledge_type: column
  database_id: cold_chain_pharma_compliance
  title: 'Environmentalmonitoring: Env Metrics'
  summary: JSONB column. Consolidates all temperature, humidity, shock, light and tracking telemetry collected for
    a shipment into one JSONB object for faster rule-engine evaluation.
  payload:
    table_id: table.cold_chain_pharma_compliance.environmentalmonitoring
    physical_name: env_metrics
    physical_type: jsonb
    business_type: jsonb
    column_role: status
    nullable: true
    business_definition: 'JSONB column. Consolidates all temperature, humidity, shock, light and tracking telemetry
      collected for a shipment into one JSONB object for faster rule-engine evaluation.

      Nested public field meanings:

      - temperature.avg_c: real. Average temperature recorded (°C). Example: 3.1.

      - temperature.min_c: real. Minimum temperature recorded (°C). Example: 0.1.

      - temperature.max_c: real. Maximum temperature recorded (°C). Example: 10.0.

      - temperature.excursion_count: bigint. Count of temperature deviations beyond limits. Example: 4.

      - temperature.excursion_duration_min: bigint. Total minutes of temperature deviation. Example: 48.

      - temperature.alarm_count: bigint. Number of temperature alarm events. Possible values: 0, 1, 2, 3, 4, 5.

      - humidity.humidity_monitor: text. Humidity monitoring flag. **NULL means humidity was not monitored.**. Possible
      values: No, Partial, Yes.

      - humidity.avg_pct: real. Average relative humidity percentage. Example: 42.3.

      - humidity.excursion_count: bigint. Count of humidity deviations. Possible values: 0, 1, 2, 3, 4, 5.

      - light_and_shock.light_monitor_mode: text. Light-exposure monitoring flag. **NULL means light was not monitored.**.
      Possible values: Continuous, Periodic.

      - light_and_shock.shock_monitor: text. Shock-event monitoring flag. **NULL means shock was not monitored.**.
      Possible values: Active, Passive.

      - light_and_shock.shock_event_count: bigint. Count of shock events detected. Example: 5.

      - tracking.location_tracking_state: text. Location-tracking status indicator. Possible values: Active, Failed,
      Intermittent.

      - tracking.gps_completeness_pct: text. GPS completeness/coverage descriptor. Example: 97.4.

      - tracking.route_deviation_incidents: bigint. Number of route deviation incidents. Possible values: 0, 1,
      2, 3.

      - tracking.unscheduled_stops: bigint. Count of unplanned stops. Possible values: 0, 1, 2, 3, 4, 5.

      - tracking.stop_duration_min: bigint. Total minutes spent in unplanned stops. Example: 55.'
    unit: degrees Celsius
    default_aggregation: null
    usage_warnings:
    - NULL means humidity was not monitored.
    - NULL means light was not monitored.
    - NULL means shock was not monitored.
