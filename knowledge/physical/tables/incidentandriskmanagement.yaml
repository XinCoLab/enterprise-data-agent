- knowledge_id: column.cold_chain_pharma_compliance.incidentandriskmanagement.incident_risk_record
  knowledge_type: column
  database_id: cold_chain_pharma_compliance
  title: 'Incidentandriskmanagement: Incident Risk Record'
  summary: JSONB column. Combines stability review, deviation investigation, risk assessment, reporting and impact
    analysis for a shipment into one JSONB structure to support CAPA and pharmacovigilance workflows.
  payload:
    table_id: table.cold_chain_pharma_compliance.incidentandriskmanagement
    physical_name: incident_risk_record
    physical_type: jsonb
    business_type: jsonb
    column_role: status
    nullable: true
    business_definition: 'JSONB column. Combines stability review, deviation investigation, risk assessment, reporting
      and impact analysis for a shipment into one JSONB structure to support CAPA and pharmacovigilance workflows.

      Nested public field meanings:

      - stability_and_quality.stability_data_review: text. Stability-data review summary. Possible values: Completed,
      Not Required, Pending.

      - stability_and_quality.stability_impact_assessment: text. Assessment of stability impact. **NULL means impact
      not assessed.**. Possible values: Major, Minor.

      - stability_and_quality.product_quality_impact: text. Product-quality impact summary. **NULL means impact
      not assessed.**. Possible values: Confirmed, Possible.

      - batch_decision.batch_release_decision: text. Decision on batch release. Possible values: Approved, Pending,
      Rejected.

      - deviation_investigation.investigation_status: text. Deviation investigation status. **NULL means investigation
      not started.**. Possible values: Completed, Ongoing.

      - deviation_investigation.corrective_actions: text. Corrective actions taken. **NULL means actions not defined.**.
      Possible values: Implemented, Pending.

      - deviation_investigation.preventive_actions: text. Preventive actions planned. **NULL means actions not defined.**.
      Possible values: Implemented, Planned.

      - risk.risk_assessment_status: text. Overall risk-assessment status. Possible values: Completed, Ongoing,
      Required.

      - risk.risk_level: text. Assigned risk level. **NULL means level not set.**. Possible values: High, Low, Medium.

      - reporting_notification.incident_report_status: text. Incident-reporting status. **NULL means report not
      filed.**. Possible values: Draft, Reviewed, Submitted.

      - reporting_notification.health_authority_notification: text. Health-authority notification status. Possible
      values: Completed, Not Required, Pending.

      - reporting_notification.authority_response: text. Authority response summary. **NULL means no response yet.**.
      Possible values: Acknowledged, Investigation.

      - reporting_notification.customer_notification: text. Customer notification status. Possible values: Completed,
      Not Required, Pending.

      - reporting_notification.customer_response: text. Customer response summary. **NULL means no response yet.**.
      Possible values: Accepted, Rejected.

      - impact.patient_impact: text. Assessment of patient impact. **NULL means impact not assessed.**. Possible
      values: Confirmed, Possible.

      - impact.market_impact: text. Assessment of market impact. **NULL means impact not assessed.**. Possible values:
      Limited, Significant.

      - impact.reputation_impact: text. Reputation impact statement. **NULL means impact not assessed.**. Possible
      values: Major, Minor.

      - lessons_learned: text. Lessons learned documentation reference. Possible values: In Progress, No, Yes.'
    unit: null
    default_aggregation: null
    usage_warnings:
    - NULL means impact not assessed.
    - NULL means investigation not started.
    - NULL means actions not defined.
    - NULL means level not set.
    - NULL means report not filed.
    - NULL means no response yet.
