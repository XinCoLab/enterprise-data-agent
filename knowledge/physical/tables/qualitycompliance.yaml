- knowledge_id: column.cold_chain_pharma_compliance.qualitycompliance.qc_checklist
  knowledge_type: column
  database_id: cold_chain_pharma_compliance
  title: 'Qualitycompliance: QC Checklist'
  summary: JSONB column. Bundles seal integrity, product/pack condition, documentation and regulatory checks plus
    release status into a single JSONB field for one-click quality-decision review.
  payload:
    table_id: table.cold_chain_pharma_compliance.qualitycompliance
    physical_name: qc_checklist
    physical_type: jsonb
    business_type: jsonb
    column_role: status
    nullable: true
    business_definition: 'JSONB column. Bundles seal integrity, product/pack condition, documentation and regulatory
      checks plus release status into a single JSONB field for one-click quality-decision review.

      Nested public field meanings:

      - security.seal_status: text. Security seal status. **NULL means seal status not captured.**. Possible values:
      Broken, Intact, Suspicious.

      - security.security_incident: text. Security incident notes. Possible values: 0, 1, 2.

      - product_integrity.product_intact_check: text. Product-integrity check result. Possible values: Conditional,
      Failed, Passed.

      - product_integrity.pack_condition: text. Packaging condition assessment. **NULL means packaging condition
      not assessed.**. Possible values: Compromised, Damaged, Good.

      - product_integrity.label_condition: text. Label condition assessment. Possible values: Clear, Damaged, Illegible.

      - documentation.documentation_complete: text. Documentation completeness status. Possible values: Complete,
      Incomplete, Partial.

      - documentation.certification_status: text. Certification status at reception. Possible values: Complete,
      Expired, Missing.

      - customs_and_regulatory.custom_clearance_status: text. Customs-clearance status. Possible values: Cleared,
      Delayed, Pending.

      - customs_and_regulatory.import_permit_status: text. Import-permit compliance status. Possible values: Not
      Required, Pending, Valid.

      - customs_and_regulatory.regulatory_compliance_status: text. Regulatory compliance status. Possible values:
      Compliant, Non-compliant, Under Review.

      - gdp_quality.sop_compliance: text. Standard operating procedure compliance status. Possible values: Full,
      Non-compliant, Partial.

      - gdp_quality.gdp_compliance: text. Good distribution practice compliance status. Possible values: Full, Non-compliant,
      Partial.

      - gdp_quality.quality_agreement_status: text. Quality agreement status with partners. Possible values: Active,
      Expired, Pending.

      - gdp_quality.quality_review_status: text. Quality review status. Possible values: Approved, Pending, Rejected.

      - gdp_quality.responsible_person: text. Responsible quality person. Example: Scott Alexander.

      - gdp_quality.quality_approval_ts: timestamp. Timestamp of quality approval. **NULL means approval pending.**.
      Example: 2025/1/23.

      - release.product_release_status: text. Product release status. Possible values: Quarantined, Rejected, Released.

      - release.release_ts: timestamp. Product release timestamp. Possible values: 2025/2/19.

      - release.quarantine_reason: text. Reason for quarantine if applicable. **NULL means product not quarantined.**.
      Possible values: Damage, Documentation, Temperature Deviation.'
    unit: null
    default_aggregation: null
    usage_warnings:
    - NULL means seal status not captured.
    - NULL means packaging condition not assessed.
    - NULL means approval pending.
    - NULL means product not quarantined.
