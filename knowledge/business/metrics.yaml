- knowledge_id: metric.cold_chain_pharma_compliance.mean_kinetic_temperature_mkt
  knowledge_type: metric
  database_id: cold_chain_pharma_compliance
  title: Mean Kinetic Temperature (MKT)
  summary: A calculated temperature that expresses the overall effect of temperature fluctuations during storage
    or transit.
  payload:
    business_definition: 'A calculated temperature that expresses the overall effect of temperature fluctuations
      during storage or transit.

      Public HKB definition: MKT = \frac{-\Delta H/R}{\ln\left(\frac{\sum_{i=1}^{n} e^{-\Delta H/RT_i}}{n}\right)},
      \text{where } \Delta H \text{ is the activation energy (usually 83.144 kJ/mol for pharmaceuticals), R is the
      gas constant (8.3144 J/mol/K), and } T_i \text{ is each temperature point in Kelvin.}'
